name: Riwayat Emulator Capture

# Owner-authorized dynamic analysis of the genuine فضاء الروايات app.
# No secrets are stored in this repo. The genuine, unmodified app splits
# are downloaded from this repo's own Release (tag splits-v1) and installed
# as a SYSTEM app on a rooted cloud emulator, so the app's own license
# check passes on its own (installer/system-app branch). Frida then
# observes the live HMAC-signed chapter request. Nothing here patches or
# bypasses any license check.

on:
  workflow_dispatch:

jobs:
  capture:
    # ARM64 host: the arm64-v8a emulator runs NATIVELY here (with KVM),
    # so the ARM64 app and Frida hooks work. On an x86_64 host the same
    # image is rejected: "Avd's CPU Architecture 'arm64' is not supported
    # by the QEMU2 emulator on x86_64 host" (run #2 failed exactly this way).
    # ubuntu-24.04-arm is free and unlimited on public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frida + download genuine splits
        run: |
          set -e
          pip install frida-tools
          FRIDA_VER=$(python3 -c "import frida; print(frida.__version__)")
          echo "frida version: ${FRIDA_VER}"
          curl -sL -o frida-server.xz "https://github.com/frida/frida/releases/download/${FRIDA_VER}/frida-server-${FRIDA_VER}-android-arm64.xz"
          xz -d frida-server.xz
          chmod +x frida-server
          mkdir -p splits_sys
          BASE_URL="https://github.com/RXCZ1/riwayat-emulator-capture/releases/download/splits-v1"
          curl -sL -o splits_sys/base.apk "${BASE_URL}/base.apk"
          curl -sL -o splits_sys/split_config.arm64_v8a.apk "${BASE_URL}/split_config.arm64_v8a.apk"
          curl -sL -o splits_sys/split_config.en.apk "${BASE_URL}/split_config.en.apk"
          curl -sL -o splits_sys/split_config.fr.apk "${BASE_URL}/split_config.fr.apk"
          curl -sL -o splits_sys/split_config.mdpi.apk "${BASE_URL}/split_config.mdpi.apk"
          ls -la splits_sys frida-server

      - name: Emulator + capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          emulator-boot-timeout: 1800
          disable-animations: true
          script: bash run_capture.sh

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riwayat-capture
          path: |
            capture.log
            uiauto.log
            frida-out.log
            run_capture.log
            ui.xml
            screen.png
          if-no-files-found: warn
